
name: FraudGuard CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Ruff
        run: python -m pip install ruff==0.17.3

      - name: Run Ruff
        run: python -m ruff check src tests dags scripts

      - name: Run tests
        run:  |
          python -X importtime -m pytest --collect-only -q 2> importtime.log
          python - <<'PY'
          import re

          entries = []

          with open("importtime.log", encoding="utf-8") as file:
              for line in file:
                  match = re.search(
                      r"import time:\s+(\d+)\s+\|\s+(\d+)\s+\|\s+(.+)",
                      line,
                  )
                  if match:
                      self_time = int(match.group(1))
                      cumulative_time = int(match.group(2))
                      module = match.group(3).strip()
                      entries.append((cumulative_time, self_time, module))

          print("\nTop imports by cumulative time:")
          for cumulative, self_time, module in sorted(
              entries, reverse=True
          )[:25]:
              print(
                  f"{cumulative / 1_000_000:8.3f}s cumulative | "
                  f"{self_time / 1_000_000:8.3f}s self | {module}"
              )
          PY