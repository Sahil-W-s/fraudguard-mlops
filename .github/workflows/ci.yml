
name: FraudGuard CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Ruff
        run: python -m pip install ruff==0.17.3

      - name: Run Ruff
        run: python -m ruff check src tests dags scripts

      - name: Profile test module imports
        run: |
          python - <<'PY'
          import importlib.util
          import time
          from pathlib import Path

          files = sorted(Path("tests").rglob("test_*.py"))

          for file in files:
              started = time.perf_counter()

              spec = importlib.util.spec_from_file_location(
                  f"profile_{file.stem}",
                  file,
              )
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)

              elapsed = time.perf_counter() - started
              print(f"IMPORT TIME: {elapsed:.2f}s | {file}", flush=True)
          PY