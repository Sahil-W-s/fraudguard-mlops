
name: FraudGuard CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Ruff
        run: python -m pip install ruff==0.17.3

      - name: Run Ruff
        run: python -m ruff check src tests dags scripts

      - name: Profile collection by test file
        run: |
          python - <<'PY'
          import time
          import pytest

          class CollectionProfiler:
              @pytest.hookimpl(hookwrapper=True)
              def pytest_collect_file(self, file_path, parent):
                  started = time.perf_counter()
                  yield
                  elapsed = time.perf_counter() - started

                  if file_path.suffix == ".py" and "test" in file_path.name:
                      print(
                          f"\nCOLLECTION TIME: {elapsed:.2f}s "
                          f"| {file_path}",
                          flush=True,
                      )

          pytest.main(
              ["--collect-only", "-q", "tests"],
              plugins=[CollectionProfiler()],
          )
          PY